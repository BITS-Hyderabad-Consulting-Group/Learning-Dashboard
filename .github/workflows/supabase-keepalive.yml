name: Supabase keepalive

# Free-tier Supabase projects are paused after 7 days without activity.
# This pings the app's keepalive endpoint, which reads from the database,
# so the project stays awake even in weeks with no deploys and no visitors.

on:
    schedule:
        # Every 3 days at 04:17 UTC (an odd minute keeps us off GitHub's busiest slots).
        - cron: '17 4 */3 * *'
    workflow_dispatch:

jobs:
    ping:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Ping keepalive endpoint
              env:
                  KEEPALIVE_URL: ${{ vars.KEEPALIVE_URL || 'https://learn.bhcg.co.in/api/keepalive' }}
              run: |
                  for attempt in 1 2 3; do
                    echo "Attempt $attempt: GET $KEEPALIVE_URL"
                    status=$(curl -sS -o response.json -w '%{http_code}' --max-time 60 "$KEEPALIVE_URL" || echo 000)
                    echo "HTTP $status"
                    cat response.json 2>/dev/null || true
                    echo
                    if [ "$status" = "200" ]; then
                      echo "Supabase keepalive ping succeeded."
                      exit 0
                    fi
                    sleep 30
                  done
                  echo "::error::Keepalive ping failed after 3 attempts — the Supabase project may be paused."
                  exit 1
